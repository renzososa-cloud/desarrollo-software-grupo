# ===============================
# Configuración del Servidor
# ===============================
server.port=8080

# ===============================
# Configuración de Conexión a Base de Datos MySQL
# ===============================
# Combina tu creación automática con los parámetros de seguridad/zona horaria
spring.datasource.url=jdbc:mysql://localhost:3306/facturacion_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Configuración de JPA e Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Esto formatea las consultas SQL en la consola para que sean legibles
spring.jpa.properties.hibernate.format_sql=true
# Especifica el dialecto exacto para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Habilitar ejecución de scripts de datos (data.sql)
# ===============================
# Asegura que data.sql se ejecute DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always